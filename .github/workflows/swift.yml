# This repo is a SwiftUI app built with macos-app/build-app.sh, not SPM.
# A stock `swift build` job stays red. Keep a no-op check until there is a real test target.

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Confirm mirror layout
        run: |
          test -f macos-app/build-app.sh
          test -f engine/ChopsticksAIEngine.swift
          test -f server/chopsticks-ai.js
          echo "Layout ok. Build on macOS with: ./macos-app/build-app.sh v3.7.3 online"
